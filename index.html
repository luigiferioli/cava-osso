<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#BFE8DD">
<meta name="apple-mobile-web-app-title" content="Cava Osso">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<title>Cava Osso</title>
<style>
/* CAVA OSSO — estilos.  Tudo é medido em "u": 1u = 1px numa tela de 640x360 (o JS ajusta --u). */
:root{
  --u:1px; --b:calc(var(--u)*68);
  --ceu:#BFE8DD; --terra:#D2A06A; --terra2:#B98550; --osso:#F4EAD0; --marrom:#5A3A2A;
  --amarelo:#F4B63F; --coral:#E8563F; --rosa:#F06C8B; --verde:#2A9D8F; --creme:#FFF6E0;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#BFE8DD;color:#5A3A2A;
  font-family:"Arial Rounded MT Bold","Nunito","Baloo 2","Varela Round",ui-rounded,"Segoe UI","Trebuchet MS",system-ui,sans-serif;font-weight:900}
body{position:relative}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:none}
button svg,.semToque{pointer-events:none}
svg{display:block;overflow:visible}
#simbolos{position:absolute;width:0;height:0;overflow:hidden}
#medidor{position:absolute;left:-200px;top:0;width:10px;height:10px;visibility:hidden;overflow:hidden;pointer-events:none}
/* #app é o PALCO, sempre em paisagem. O JS (mede) dá o tamanho em px e, em aparelho de toque em retrato, gira 90°;
   com mouse em janela alta, o palco 16:9 fica centralizado e o fundo do body faz as faixas. */
#app{position:absolute;left:0;top:0;width:100%;height:100%;background:#BFE8DD;touch-action:none;transform-origin:0 0;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#app.girado{padding:env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px) env(safe-area-inset-top,0px)}
#jogo{position:relative;width:100%;height:100%;overflow:hidden;background:#BFE8DD}

/* ---------- botões ---------- */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*6);min-width:calc(var(--u)*64);min-height:calc(var(--u)*64);padding:calc(var(--u)*6) calc(var(--u)*12);
  background:#F4B63F;border:calc(var(--u)*3) solid #5A3A2A;border-radius:calc(var(--u)*20);box-shadow:0 calc(var(--u)*4) 0 #5A3A2A;
  font-size:calc(var(--u)*18);letter-spacing:.03em;position:relative;transition:transform .08s}
.bt:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*1) 0 #5A3A2A}
.bt svg{width:calc(var(--u)*34);height:calc(var(--u)*34);flex:none}
.bt.enorme{min-height:calc(var(--u)*70);padding:calc(var(--u)*8) calc(var(--u)*28);font-size:calc(var(--u)*34);border-radius:calc(var(--u)*26);background:#E8563F;color:#fff}
.bt.quad{flex-direction:column;gap:calc(var(--u)*1);width:calc(var(--u)*66);min-height:calc(var(--u)*64);height:100%;padding:calc(var(--u)*3) calc(var(--u)*2);font-size:calc(var(--u)*10);border-radius:calc(var(--u)*16);letter-spacing:0}
.bt.quad svg{width:calc(var(--u)*40);height:calc(var(--u)*40)}
.bt.ligado{background:#F06C8B;color:#fff}
.bt .feitoIc{position:absolute;right:calc(var(--u)*-4);top:calc(var(--u)*-5);width:calc(var(--u)*18)!important;height:calc(var(--u)*18)!important}
.flutua{position:absolute;bottom:calc(var(--u)*16);right:calc(var(--u)*18);width:calc(var(--u)*120);z-index:6}
.pulsa{animation:pulsaBt 1.1s ease-in-out infinite}
@keyframes pulsaBt{50%{transform:scale(1.08)}}
.chama{animation:chama .55s ease-in-out infinite}
@keyframes chama{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.12);filter:brightness(1.25) drop-shadow(0 0 8px #fff)}}
/* próximo passo sugerido: pulso bem visível, com brilho */
.sugere{animation:sugere .8s ease-in-out infinite;z-index:3}
@keyframes sugere{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.14);filter:drop-shadow(0 0 calc(var(--u)*4) #fff) drop-shadow(0 0 calc(var(--u)*9) #E8563F)}}
/* ilustração de um selo (símbolo selo-*, 200x200), sempre de cantos arredondados */
.ilus{display:block;width:100%;height:100%;border-radius:22%;overflow:hidden;pointer-events:none}
.ilus>svg{width:100%;height:100%}
.treme{animation:treme .45s}
@keyframes treme{25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}

/* ---------- barra de fala ---------- */
#barra{position:absolute;left:0;top:0;right:0;height:var(--b);display:flex;align-items:stretch;gap:calc(var(--u)*5);padding:calc(var(--u)*2) calc(var(--u)*6);z-index:7;pointer-events:none}
#barra>*{pointer-events:auto}
#btVoltar{flex:none;width:calc(var(--u)*64);background:#FFF6E0;border:calc(var(--u)*3) solid #5A3A2A;border-radius:calc(var(--u)*18);display:flex;align-items:center;justify-content:center}
#btVoltar svg{width:55%;height:55%}
#btVoltar{position:relative}
#btVoltar::after{content:"";position:absolute;inset:calc(var(--u)*-2) calc(var(--u)*-3) calc(var(--u)*-4) calc(var(--u)*-6)}
#fala{flex:1;min-width:0;display:flex;align-items:center;gap:calc(var(--u)*6);padding:0 calc(var(--u)*10) 0 calc(var(--u)*6);background:#fff;border:calc(var(--u)*3) solid #5A3A2A;border-radius:calc(var(--u)*20);text-align:left;overflow:hidden}
#fala>svg{flex:none;width:calc(var(--u)*28);height:calc(var(--u)*28);color:#E8563F}
#falaCaixa{flex:1;min-width:0;height:100%;display:flex;align-items:center;overflow:hidden}
#falaTxt{display:block;width:100%;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;color:#5A3A2A}
#fala.falando{animation:falando .5s}
@keyframes falando{30%{transform:scale(1.03)}}
#ossinhos{flex:none;display:flex;align-items:center;gap:calc(var(--u)*3);padding:0 calc(var(--u)*8);background:#fff;border:calc(var(--u)*3) solid #5A3A2A;border-radius:calc(var(--u)*20);font-size:calc(var(--u)*18)}
#ossinhos svg{width:calc(var(--u)*24);height:calc(var(--u)*12);color:#5A3A2A;opacity:.22}
#ossinhos svg.tem{opacity:1;color:#E8563F;animation:pop .5s}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.5)}}
#ossinhos span{margin-left:calc(var(--u)*4)}

/* ---------- telas ---------- */
.tela{position:absolute;left:0;top:0;width:100%;height:100%;display:none;padding:var(--b) calc(var(--u)*6) calc(var(--u)*6)}
.tela.ativa{display:flex}

/* início */
#t-inicio{padding:0;background:linear-gradient(to top,#B98550 0 7%,#D2A06A 7% 20%,#BFE8DD 20%)}
.inicioEsq{flex:none;width:46%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*16);padding-bottom:calc(var(--u)*20)}
.titulo{margin:0;font-size:calc(var(--u)*66);line-height:.95;text-align:center;color:#E8563F;letter-spacing:.03em;
  -webkit-text-stroke:calc(var(--u)*2.5) #5A3A2A;paint-order:stroke fill;text-shadow:0 calc(var(--u)*5) 0 #5A3A2A}
.titulo span{display:block}
.titulo span:last-child{color:#F4EAD0}
#inicioDino{flex:1;min-width:0;padding:calc(var(--u)*8) calc(var(--u)*70) 4% 0}
#inicioDino svg{width:100%;height:100%}
#btAdulto{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*4);width:calc(var(--u)*64);height:calc(var(--u)*64);border-radius:50%;opacity:.5;display:flex;align-items:center;justify-content:center;color:#5A3A2A}
#btAdulto svg{width:calc(var(--u)*30);height:calc(var(--u)*30)}
#btAdulto::after{content:"";position:absolute;inset:calc(var(--u)*6);border-radius:50%;border:calc(var(--u)*5) solid #E8563F;opacity:0;transform:scale(.3)}
#btAdulto.segurando{opacity:1}
#btAdulto.segurando::after{opacity:1;transform:scale(1);transition:transform 2s linear,opacity .2s}

/* solo */
#t-solo{gap:calc(var(--u)*6)}
.solo{flex:1;min-width:0;display:flex;flex-direction:column;border:calc(var(--u)*3) solid #5A3A2A;border-radius:calc(var(--u)*20);overflow:hidden;background:#D2A06A}
.grama{flex:none;height:calc(var(--u)*10);background:#6FD0A0;border-bottom:calc(var(--u)*3) solid #2F8571}
#camadas{flex:1;min-height:0;display:flex;flex-direction:column}
.camada{flex:1;min-height:0;position:relative;display:flex;align-items:center;gap:calc(var(--u)*5);padding:0 calc(var(--u)*6);border-bottom:calc(var(--u)*3) dashed #7A5A3A66}
.camada:last-child{border-bottom:0}
.placa{flex:none;width:calc(var(--u)*104);min-height:calc(var(--u)*64);background:#FFF6E0;border:calc(var(--u)*3) solid #5A3A2A;border-radius:calc(var(--u)*12);padding:0 calc(var(--u)*2);
  display:inline-flex;align-items:center;justify-content:center;font-size:calc(var(--u)*15);letter-spacing:.03em;transform:rotate(-2deg);box-shadow:0 calc(var(--u)*3) 0 #5A3A2A88}
.camada.aberta .placa{background:#F4B63F}
.placa{position:relative}
.placa .info,#btEra .info{position:absolute;right:calc(var(--u)*-9);top:calc(var(--u)*-11);width:calc(var(--u)*32);height:calc(var(--u)*32);filter:drop-shadow(0 calc(var(--u)*2) 0 #5A3A2A88)}
.info.nova{animation:pulsaBt 1.1s ease-in-out infinite}
.soloLado{flex:none;width:calc(var(--u)*88);display:flex;flex-direction:column;gap:calc(var(--u)*8);padding:calc(var(--u)*6) 0 calc(var(--u)*4)}
#btEra{flex:none;min-height:calc(var(--u)*78);flex-direction:column;gap:calc(var(--u)*3);padding:calc(var(--u)*4);font-size:calc(var(--u)*11);line-height:1.05;background:#FFF6E0}
#eraPilha{display:flex;flex-direction:column;width:calc(var(--u)*50);height:calc(var(--u)*32);border:calc(var(--u)*2) solid #5A3A2A;border-radius:calc(var(--u)*7);overflow:hidden}
#eraPilha i{flex:1;border-top:calc(var(--u)*1) dashed #7A5A3A}
#eraPilha i:first-child{border-top:0}
.marcas{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-around;gap:calc(var(--u)*4)}
.marca{flex:none;width:calc(var(--u)*72);height:calc(var(--u)*72);border-radius:50%;position:relative}
.marca>svg{width:100%;height:100%}
.marca.x{animation:pulsaBt 1.1s ease-in-out infinite}
.marca.x:nth-child(2n){animation-delay:.4s}
.marca.buraco{background:radial-gradient(ellipse at 50% 60%,#7a5230 0 55%,#9c6e42 56% 68%,transparent 69%)}
.marca.buraco>svg.dino{position:absolute;left:12%;top:10%;width:76%;height:76%}
.marca .selinho{position:absolute;right:calc(var(--u)*-2);top:calc(var(--u)*-2);width:calc(var(--u)*26);height:calc(var(--u)*26);background:#fff;border:calc(var(--u)*2) solid #5A3A2A;border-radius:50%;padding:calc(var(--u)*3);animation:pulsaBt 1.1s ease-in-out infinite}
.marca.dorme{opacity:.5}
.marca.dorme>svg{width:70%;height:70%;margin:15%}
.marca.dorme *{fill:#5A3A2A!important;stroke:#5A3A2A!important}
.camada.fechada{filter:saturate(.55) brightness(.92)}
.camada.fechada .placa{opacity:.75}
.camada.aponta{animation:aponta .5s ease-in-out 5}
@keyframes aponta{50%{box-shadow:inset 0 0 0 calc(var(--u)*5) #fff,inset 0 0 calc(var(--u)*30) #fff}}
.camada.nova{animation:aponta .5s ease-in-out 6}
#btAlbum,#btAlbumQuem{flex:none;width:calc(var(--u)*88);flex-direction:column;padding:calc(var(--u)*4);font-size:calc(var(--u)*15);line-height:1.05;background:#2A9D8F;color:#fff;margin-bottom:calc(var(--u)*4)}
#btAlbum svg,#btAlbumQuem svg{width:calc(var(--u)*46);height:calc(var(--u)*46)}
#btAlbum{flex:1;min-height:0;margin-bottom:0}
#btAlbumQuem{background:#35506b;width:auto;min-height:calc(var(--u)*64);flex-direction:row;gap:calc(var(--u)*3);padding:calc(var(--u)*2);font-size:calc(var(--u)*11);margin:0 calc(var(--u)*8) 0 0}
#btAlbumQuem svg{width:calc(var(--u)*30);height:calc(var(--u)*30)}

/* cavar */
#cova{flex:1;min-width:0;position:relative;border:calc(var(--u)*4) solid #5A3A2A;border-radius:calc(var(--u)*22);overflow:hidden;background:#8a5f38;touch-action:none}
#achados{position:absolute;inset:0;background:radial-gradient(ellipse at center,#a87a4c,#7d5532)}
#achados svg{position:absolute}
#achados svg.achou{animation:achou .7s ease-out}
@keyframes achou{0%{filter:none}40%{filter:brightness(1.35) drop-shadow(0 0 14px #FFE7A3)}100%{filter:drop-shadow(0 0 5px #FFE7A3)}}
#achados svg.achou{filter:drop-shadow(0 0 5px #FFE7A3)}
#achados .revelado{position:absolute;border:calc(var(--u)*5) solid #FFF6E0;border-radius:calc(var(--u)*30);overflow:hidden;box-shadow:0 0 0 calc(var(--u)*3) #5A3A2A,0 0 calc(var(--u)*34) calc(var(--u)*6) #FFE7A3}
#achados .revelado .ilus{border-radius:0}
#terra{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;transition:opacity .9s}
#poeira,#brilhos{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#poeira i{position:absolute;width:10px;height:10px;border-radius:50%;background:#8d6238}
#brilhos i{position:absolute;width:calc(var(--u)*110);height:calc(var(--u)*110);margin:calc(var(--u)*-55) 0 0 calc(var(--u)*-55);border-radius:50%;
  background:radial-gradient(circle,#FFF6C8 0,#FFE7A3aa 35%,transparent 68%);animation:brilho 2.6s ease-in-out forwards}
@keyframes brilho{0%{opacity:0;transform:scale(.5)}25%{opacity:.9;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}75%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
#dicaPa{position:absolute;left:44%;top:22%;width:12%;height:56%;pointer-events:none;animation:cavuca 1.3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes cavuca{0%,100%{transform:translateX(-90%) rotate(-18deg)}50%{transform:translateX(90%) rotate(18deg)}}

/* bancada */
#bancada{flex:1;min-width:0;background:#D6ECE4;border:calc(var(--u)*4) solid #5A3A2A;border-radius:calc(var(--u)*22);overflow:hidden;touch-action:none}
#bancada svg{width:100%;height:100%;touch-action:none}
#bancada .mesa{fill:#E9D4A8;stroke:#7A5A3A;stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round}
#bancada .silhueta{opacity:.85}
#bancada .silhueta *{fill:#fff!important;stroke:#fff!important}
#bancada .fantasma *{fill:none!important;stroke:#A98A63!important;stroke-width:3!important;stroke-dasharray:3 7!important}
#bancada .fantasma [stroke="#F4EAD0"]{display:none}
#bancada .alvoPeca *{fill:#F4B63F!important;stroke:#F4B63F!important}
#bancada .alvoPeca{animation:alvoPeca 1s ease-in-out infinite}
@keyframes alvoPeca{0%,100%{opacity:.25}50%{opacity:.95}}
#bancada .mesa,#bancada .silhueta,#bancada .fantasma,#bancada .postas,#bancada .vivo,#bancada .alvoPeca{transition:opacity 1.2s}
#bancada .peca{transform-origin:0 0;transition:transform .45s cubic-bezier(.34,1.35,.64,1)}
#bancada .peca.arrasta{transition:transform .06s linear}
#bancada .peca.volta{transition:transform .9s ease-in-out}
#bancada .pega{fill:#fff;fill-opacity:0;stroke:none;cursor:grab}
#bancada .pega.vez{fill-opacity:.55;animation:vez 1s ease-in-out infinite}
@keyframes vez{0%,100%{fill-opacity:.15}50%{fill-opacity:.7}}
#bancada .mao{pointer-events:none}
#bancada.pronto .mesa,#bancada.pronto .silhueta,#bancada.pronto .fantasma,#bancada.pronto .postas,#bancada.pronto .alvoPeca{opacity:0}
#bancada.pronto .vivo{opacity:1!important}

/* ficha */
#t-ficha{gap:calc(var(--u)*6)}
#selos{flex:none;width:calc(var(--u)*68);display:flex;flex-direction:column;gap:calc(var(--u)*4)}
.selo{flex:1;min-height:0;width:100%;border-radius:calc(var(--u)*18);border:calc(var(--u)*3) dashed #7A5A3A99;background:#fff6;display:flex;align-items:center;justify-content:center;position:relative}
.selo>svg{width:calc(var(--u)*30);height:calc(var(--u)*30);opacity:.45}
.selo>svg.dino{width:calc(var(--u)*46);height:calc(var(--u)*32)}
.selo.pista{border-color:#F4B63F;background:radial-gradient(circle,#fff 0,#FFE7A3 55%,#fff6 80%)}
.selo.pista>svg{width:calc(var(--u)*52);height:calc(var(--u)*52);opacity:1;animation:pistaPisca .8s ease-in-out infinite}
.selo.tem{border:calc(var(--u)*3) solid #5A3A2A;background:#F4B63F;overflow:hidden}
.selo.tem>.ilus{border-radius:calc(var(--u)*14)}
.selo.novo{animation:seloNovo 2.2s ease-in-out infinite}
@keyframes seloNovo{0%,100%{box-shadow:0 0 0 0 #fff0,0 0 0 0 #F4B63F00}50%{box-shadow:0 0 0 calc(var(--u)*2.5) #fff,0 0 calc(var(--u)*10) calc(var(--u)*4) #F4B63F}}
.selo.sugere{animation:sugere .8s ease-in-out infinite}
.selo.atual{box-shadow:0 0 0 calc(var(--u)*3) #E8563F}
.selo.carimba{animation:carimba .7s cubic-bezier(.3,1.6,.6,1) both}
@keyframes carimba{0%{transform:scale(3.5) rotate(-40deg);opacity:0}60%{transform:scale(.9) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
#fichaMeio{flex:1;min-width:0;position:relative;background:linear-gradient(#ffffff88 0 82%,#D2A06A 82%);border:calc(var(--u)*3) solid #5A3A2A;border-radius:calc(var(--u)*22);overflow:hidden}
#fichaMeio.raiox{background:linear-gradient(#35506b 0 82%,#243a50 82%)}
#fichaPalco{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*34);bottom:calc(var(--u)*6)}
#fichaPalco svg{width:100%;height:100%;touch-action:none}
#fichaPalco .vivo,#fichaPalco .esq{transition:opacity .7s}
#fichaPalco .esq{opacity:0;pointer-events:none}
#fichaPalco.raiox .vivo{opacity:0}
#fichaPalco.raiox .esq{opacity:1}
#fichaPalco .anel{fill:#ffffff55;stroke:#fff;stroke-width:4;stroke-dasharray:5 7;stroke-linecap:round;pointer-events:none;animation:anel 1.8s ease-in-out infinite}
#fichaPalco .anelFora{fill:none;stroke:#5A3A2A;stroke-width:7;stroke-dasharray:5 7;stroke-linecap:round;pointer-events:none;opacity:.55}
@keyframes anel{50%{transform:scale(1.25);opacity:.6}}
#fichaPalco.chamaToque .anel{fill:#F4B63Faa;stroke:#E8563F;stroke-width:6;animation-duration:.9s}
@keyframes anelForte{50%{transform:scale(1.5);opacity:.7}}
#fichaPalco.chamaToque .anel{animation-name:anelForte}
#fichaPalco .estrelinha{pointer-events:none}
#fichaNome{position:absolute;left:0;top:0;min-height:calc(var(--u)*64);padding:calc(var(--u)*8) calc(var(--u)*12) 0;font-size:calc(var(--u)*25);letter-spacing:.04em;-webkit-text-stroke:calc(var(--u)*1) #5A3A2A;text-shadow:0 calc(var(--u)*2) 0 #5A3A2A55;z-index:2;display:flex;align-items:flex-start}
#estrelas{position:absolute;right:calc(var(--u)*6);top:calc(var(--u)*6);display:flex;align-items:center;gap:calc(var(--u)*3);font-size:calc(var(--u)*18);background:#fff;border:calc(var(--u)*3) solid #5A3A2A;border-radius:calc(var(--u)*14);padding:calc(var(--u)*1) calc(var(--u)*8);pointer-events:none;z-index:2;color:#5A3A2A}
#estrelas svg{width:calc(var(--u)*22);height:calc(var(--u)*22)}
#comidas{position:absolute;left:0;right:0;bottom:calc(var(--u)*4);display:flex;justify-content:center;gap:calc(var(--u)*12);z-index:2}
.comida{width:calc(var(--u)*68);height:calc(var(--u)*68);border-radius:50%;background:#fff;border:calc(var(--u)*3) solid #5A3A2A;box-shadow:0 calc(var(--u)*4) 0 #5A3A2A;padding:calc(var(--u)*6)}
.comida svg{width:100%;height:100%}

        b.achado = !!a.achado; b.missao = !!a.missao;

        if (Array.isArray(a.selos)) for (let i = 0; i < 4; i++) b.selos[i] = a.selos[i] === 2 ? 2 : a.selos[i] === 1 ? 1 : 0;

/* animações das partes do corpo (ficha). t = entrada de d.toques */
function giraJunta(svg, d, nome, graus, dur, opt) {
  gira(junta(svg, d, nome), graus, dur, opt);
  if (nome === 'pescoco') { gira(junta(svg, d, 'osso-pescoco'), graus, dur, opt); gira(junta(svg, d, 'osso-cabeca'), graus, dur, opt); }

const cresce = (el, dur) => anima(el, [1, 1.28, 1, 1.16, 1].map(s => ({ transform: 'scale(' + s + ')' })), { duration: dur || 1100 });
const noCentro = el => { if (el) { el.style.transformBox = 'fill-box'; el.style.transformOrigin = '50% 50%'; } return el; };   // parte sem pivô no contrato: gira/cresce pelo próprio centro
/* vai até o ângulo, fica um tempo e volta (poses de demonstração na ficha) */
const vaiEVolta = (el, graus, dur) => anima(el, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(' + graus + 'deg)', offset: 0.2 }, { transform: 'rotate(' + graus + 'deg)', offset: 0.8 }, { transform: 'rotate(0deg)' }], { duration: dur });
const ANIMA_PARTE = {
  pescoco(svg, d) { giraJunta(svg, d, 'pescoco', [0, -9, 7, -5, 0], 1500); },
  boca(svg, d, t) { const a = (t && t.abre) || 18; gira(junta(svg, d, 'mandibula'), [0, a, 0, a, 0], 1000); gira(junta(svg, d, 'cabeca'), [0, -6, 0, -6, 0], 1000); },
  cabeca(svg, d) { gira(junta(svg, d, 'cabeca'), [0, -10, 8, -6, 0], 1100); giraJunta(svg, d, 'pescoco', [0, -6, 4, 0], 1100); },
  cauda(svg, d, t) { const a = (t && t.graus) || 10; giraJunta(svg, d, 'cauda', [0, a, -a, a * 0.7, -a * 0.5, 0], 1500); },
  gangorra(svg, d) { gira(junta(svg, d, 'tronco'), [0, 10, -6, 6, 0], 1900); giraJunta(svg, d, 'cauda', [0, -6, 6, -4, 0], 1900); },
  pernas(svg, d, t) { const a = (t && t.graus) || 8; ((t && t.destaque) || []).forEach((n, i) => gira(junta(svg, d, n), i % 2 ? [0, a, -a, a, -a, 0] : [0, -a, a, -a, a, 0], 1300)); },
  corpo(svg, d) { const a = Math.min(16, d.abre || 16); pula(svg.querySelector('.vivo'), [0, 20, 0, 10, 0], 800); pula(svg.querySelector('.esq'), [0, 20, 0, 10, 0], 800); gira(junta(svg, d, 'mandibula'), [0, a, 0, a, 0, a, 0], 1200); },
  placas(svg, d) {
    (d.placasOnda || []).forEach((n, i) => anima(junta(svg, d, 'placa-' + n),
      [{ transform: 'scale(1)' }, { transform: 'scale(1.45)', fill: '#F4B63F' }, { transform: 'scale(1)' }], { duration: 520, delay: i * 75 }));
  },
  cresce(svg, d, t) { const el = junta(svg, d, t.junta); if (!d.pivos[t.junta]) noCentro(el); cresce(el); },
  bracos(svg, d, t) { ((t && t.juntas) || ['bracos']).forEach((nome, i) => gira(junta(svg, d, nome), i % 2 ? [0, -22, 16, -22, 0] : [0, -30, 20, -30, 0], 1200)); },
  garra(svg, d) { gira(junta(svg, d, 'bracos'), [0, -14, 8, -10, 0], 1300); cresce(junta(svg, d, 'garra'), 1300); },
  /* pterodáctilo: bate as asas (as duas giram em sentidos opostos) */
  asas(svg, d) {
    gira(junta(svg, d, 'asa-1'), [0, -16, 16, -16, 16, 0], 1500); gira(junta(svg, d, 'asa-2'), [0, 16, -16, 16, -16, 0], 1500);
    gira(junta(svg, d, 'ponta-1'), [0, 0, 10, 0, 10, 0], 1500); gira(junta(svg, d, 'ponta-2'), [0, 0, -10, 0, -10, 0], 1500);
    Som.flap(); setTimeout(() => Som.flap(), 600);

  /* pterodáctilo: o dedo comprido que segura a asa dobra e brilha */
  dedo(svg, d) {
    [['ponta-1', 10], ['ponta-2', -10]].forEach(p => { const el = junta(svg, d, p[0]); gira(el, [0, p[1], 0, p[1], 0], 1400); anima(el, [{ filter: 'brightness(1)' }, { filter: 'brightness(1.3)' }, { filter: 'brightness(1)' }], { duration: 700, iterations: 2 }); });
  },
  /* pterodáctilo: pousa de quatro, fica um instante e volta a voar */
  pousa(svg, d) { const p = d.poses.pousado; for (const nome in p) vaiEVolta(junta(svg, d, nome), p[nome], 3200); },
  /* anquilossauro: arma a cauda e bate a clava */
  clava(svg, d) {

/* ---------- 7. MÁQUINA DE TELAS ---------- */
const Telas = {};

function ir(nome, arg) {
  if (Telas[telaAtual] && Telas[telaAtual].sai) Telas[telaAtual].sai();
  geracao++;
  Pista.esconde();

/* ---------- 8. PISTA ----------
   Quando uma atividade rende pista, o símbolo aparece brilhando na própria cena; ela toca e a pista
   "mergulha na terra": abre DIRETO a escavação daquele achado. A pista já fica garantida no estado
   (selo = 1) no momento em que aparece: se ela sair sem tocar, ou sair no meio da escavação, a pista
   reaparece brilhando na ficha daquele dinossauro, no lugar do selo correspondente.                */
const Pista = {
  dino: null, selo: 0, fx: null, fy: null, indo: false,
  /* devolve true se rendeu pista nova; `antes` são as frases ditas antes de a pista aparecer */
  oferece(dk, i, antes, pos, anuncio) {
    const e = estado.dinos[dk];
    if (e.selos[i] !== 0) { dizer(antes); return false; }
    e.selos[i] = 1; salvar();
    this.dino = dk; this.selo = i;
    const g = geracao;
    dizer([].concat(antes || [], [{ t: anuncio || UI.pista, ao: () => { if (g === geracao) this.mostra(pos); } }, UI.toquePista]));
    depois(8000, () => this.mostra(pos));
    return true;
  },
  mostra(pos) {
    const b = $('#pista');
    if (!b.hidden || this.indo) return;
    pos = pos || { x: Tela.w * 0.42, y: Tela.h * 0.62 };
    this.fx = pos.x / Tela.w; this.fy = pos.y / Tela.h;
    b.style.left = pos.x + 'px'; b.style.top = pos.y + 'px';
    b.hidden = false;
    anima(b, [{ transform: 'scale(0) rotate(-90deg)' }, { transform: 'scale(1.3) rotate(8deg)' }, { transform: 'scale(1) rotate(0)' }], { duration: 500 });
    Som.festa();
  },
  toca() { const b = $('#pista'); if (!b.hidden) this.mergulha(this.dino, this.selo, b); },
  /* transição curta: a pista gira e afunda enquanto a terra toma a tela a partir dela; em seguida, a escavação */
  mergulha(dk, i, el) {
    if (this.indo) return;
    this.indo = true;
    tokFala++; Voz.calar();
    Som.voa();
    const c = caixaPalco(el), m = $('#mergulho'), ic = m.firstElementChild, t = Math.max(c.w, 70 * Tela.u);
    const em = ' at ' + c.cx + 'px ' + c.cy + 'px)', R = Math.hypot(Tela.w, Tela.h);
    ic.style.cssText = 'left:' + (c.cx - t / 2) + 'px;top:' + (c.cy - t / 2) + 'px;width:' + t + 'px;height:' + t + 'px';
    m.style.opacity = 1; m.hidden = false;
    if (el.id === 'pista') el.style.visibility = 'hidden';
    anima(m, [{ clipPath: 'circle(' + (t * 0.7) + 'px' + em }, { clipPath: 'circle(' + R + 'px' + em }], { duration: 620, easing: 'ease-in', fill: 'forwards' });
    anima(ic, [{ transform: 'scale(1.25) rotate(0deg)' }, { transform: 'scale(1.5) rotate(140deg)', offset: 0.3 }, { transform: 'scale(0) rotate(620deg)' }], { duration: 640, easing: 'ease-in', fill: 'forwards' });
    const g = geracao;
    const limpa = () => {
      try { m.getAnimations({ subtree: true }).forEach(a => a.cancel()); } catch (_) {}
      m.hidden = true; $('#pista').style.visibility = '';
    };
    setTimeout(() => {
      this.indo = false;
      if (g !== geracao) return limpa();
      ir('cavar', { tipo: 'extra', dino: dk, selo: i });
      Som.pof();
      $('#pista').style.visibility = '';
      anima(m, [{ opacity: 1 }, { opacity: 0 }], { duration: 320, fill: 'forwards' });
      setTimeout(limpa, 340);
    }, 660);
  },
  esconde() { $('#pista').hidden = true; },
  /* a tela mudou de tamanho com a pista à mostra: ela fica no mesmo lugar relativo */
  reposiciona() { const b = $('#pista'); if (b.hidden || this.fx == null) return; b.style.left = (this.fx * Tela.w) + 'px'; b.style.top = (this.fy * Tela.h) + 'px'; }
};

/* A) INÍCIO */

  const trava = () => { try { const o = screen.orientation; if (o && o.lock) { const p = o.lock('landscape'); if (p && p.catch) p.catch(() => {}); } } catch (_) {} };
  try {
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!f) return trava();

  } catch (_) {}
}

/* B) SOLO (hub): corte do solo com as 3 camadas */

  entra(arg) {
    const cx = $('#camadas'); cx.innerHTML = '';

      const placa = document.createElement('button');

      placa.innerHTML = '<span>' + per.nome + '</span>' + (aberta ? '<svg class="info' + (estado.vistos[p] ? '' : ' nova') + '" viewBox="0 0 100 100"><use href="#x-placa-info"/></svg>' : '');
      placa.addEventListener('click', () => { Som.toque(); if (aberta) ir('historia', { tipo: 'periodo', p: p }); else this.fechada(c); });
      const m = document.createElement('div'); m.className = 'marcas';
      c.appendChild(placa); c.appendChild(m); cx.appendChild(c);
      for (const dk of dinosDe(p)) {

        else if (!e.achado) { const b = this.marca(m, 'x', usa('ic-x'), () => ir('cavar', { tipo: 'esqueleto', dino: dk })); b.dataset.dino = dk; temX = true; }
        else {
          const b = this.marca(m, 'buraco', '', () => ir('ficha', { dino: dk }));
          b.dataset.dino = dk;

          if (e.selos.indexOf(1) >= 0) b.insertAdjacentHTML('beforeend', '<svg class="selinho" viewBox="0 0 100 100"><use href="#x-pista"/></svg>');   // pista esperando na ficha

/* C) ESCAVAÇÃO: só termina quando TODOS os objetos enterrados estiverem descobertos */
function distSegmento(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? limita(((p.x - a.x) * dx + (p.y - a.y) * dy) / l2, 0, 1) : 0;
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
const LIMIAR_OBJETO = 0.75;            // fração dos pontos de amostra limpos para o objeto contar como descoberto
Telas.cavar = {
  arg: null, ctx: null, w: 0, h: 0, raio: 40, objs: [], sorte: null, pronto: false, ultimo: null, ultimaPoeira: 0, progresso: 0, relogio: 0, avisou: false,
  entra(arg) {
    const esq = arg.tipo === 'esqueleto';
    /* achado extra (pista): voltar leva à ficha do dinossauro, onde a pista fica esperando no lugar do selo */
    voltarPara = esq ? 'solo' : () => ir('ficha', { dino: arg.dino });
    this.arg = arg; this.pronto = false; this.ultimo = null; this.avisou = false;
    /* sorteio do lugar de cada peça (fica guardado para o caso de a tela mudar de tamanho) */
    this.sorte = esq
      ? embaralha([0, 1, 2, 3, 4, 5]).slice(0, pecasDe(arg.dino).length).map(cel => ({ cel: cel, rot: sorteio(-14, 14), jx: sorteio(-0.06, 0.06), jy: sorteio(-0.05, 0.05), achado: false }))
      : [{ rot: sorteio(-10, 10), jx: sorteio(-0.2, 0.2), jy: sorteio(-0.06, 0.06), achado: false }];
    $('#btCavarOk').hidden = true;
    $('#dicaPa').style.display = '';
    const os = $('#ossinhos');
    os.hidden = !esq;
    if (esq) os.innerHTML = pecasDe(arg.dino).map(() => usa('ic-ossinho')).join('') + '<span>0/' + pecasDe(arg.dino).length + '</span>';
    this.monta();
    this.progresso = Date.now();
    clearInterval(this.relogio);
    this.relogio = setInterval(() => this.confereParada(), 1000);
    dizer(UI.cavar);
  },
  sai() { clearInterval(this.relogio); },
  /* (re)cria os objetos enterrados e a terra conforme o tamanho atual da cova */
  monta() {
    const cova = $('#cova'), W = Math.max(60, cova.clientWidth), H = Math.max(60, cova.clientHeight), arg = this.arg, d = DINOS[arg.dino];
    const ach = $('#achados'); ach.innerHTML = ''; $('#brilhos').innerHTML = '';
    const cv = $('#terra');
    cv.style.transition = 'none'; cv.style.opacity = 1; cv.style.pointerEvents = '';
    this.w = W; this.h = H;
    this.raio = Math.max(38 * Tela.u, Math.min(W, H) * 0.13);
    this.objs = this.sorte.map((s, i) => {
      let svg, cx, cy, dw, dh;
      if (arg.tipo === 'esqueleto') {
        const nome = pecasDe(arg.dino)[i], c = caixaPeca(arg.dino, nome), cw = W / 3, ch = H / 2;
        const k = Math.min(cw * 0.84 / c[2], ch * 0.8 / c[3]);
        dw = c[2] * k; dh = c[3] * k;
        cx = cw * (s.cel % 3 + 0.5 + s.jx); cy = ch * (Math.floor(s.cel / 3) + 0.5 + s.jy);
        svg = svgEl('svg', { viewBox: c.join(' ') });
        svg.appendChild(criaOsso(arg.dino, nome));
      } else {
        dw = dh = Math.min(W * 0.4, H * 0.62);
        cx = W * (0.5 + s.jx); cy = H * (0.5 + s.jy);
        svg = svgEl('svg', { viewBox: '0 0 100 100' });
        svg.innerHTML = '<use href="#' + d.selos[arg.selo].s + '"/>';
      }
      svg.style.cssText = 'left:' + (cx - dw / 2) + 'px;top:' + (cy - dh / 2) + 'px;width:' + dw + 'px;height:' + dh + 'px;transform:rotate(' + s.rot + 'deg)';
      ach.appendChild(svg);

  preparaTerra() {

/* D) BANCADA: montar o esqueleto ARRASTANDO as 5 peças, passo a passo */
Telas.bancada = {
  dino: null, svg: null, pecas: {}, ativa: null, oy: 0, raioIma: 160, ocioso: 0, arrastouUma: false,
  entra(arg) {
    voltarPara = 'solo';
    const dk = this.dino = arg.dino, d = DINOS[dk], W = d.vb[0], H = d.vb[1];
    const caixa = $('#bancada');
    caixa.classList.remove('pronto'); caixa.innerHTML = '';
    $('#btBancadaOk').hidden = true;
    /* viewBox no formato da caixa: silhueta à esquerda, bandeja de peças à direita */
    const asp = limita((caixa.clientWidth || 600) / (caixa.clientHeight || 300), 1.2, 3.2);
    let vh = H * 1.16, vw = vh * asp;
    if (vw < W + 260) { vw = W + 260; vh = vw / asp; }
    const oy = this.oy = (vh - H) / 2;
    const bx = W + 8, bw = vw - W - 16, by = 8, bh = vh - 16;
    const pecas = pecasDe(dk), colunas = bw >= 360 ? 2 : 1, linhas = Math.ceil(pecas.length / colunas), lw = bw / colunas, lh = bh / linhas;
    const svg = this.svg = svgEl('svg', { viewBox: '0 0 ' + vw + ' ' + vh, 'class': 'dino' });
    svg.dataset.dino = dk;
    svg.innerHTML = '<rect class="mesa" x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="26"/>' +
      '<g transform="translate(0,' + oy + ')"><g class="silhueta">' + mioloVivo(dk, true) + '</g><g class="fantasma">' + mioloEsqueleto(dk, true) + '</g>' +
      '<g class="alvoPeca"></g><g class="postas"></g><g class="vivo" style="opacity:0">' + mioloVivo(dk) + '</g></g>' +
      '<g class="pecas"></g><g class="pegas"></g><g class="mao"></g>';
    poePivos(svg, d);
    const olho = junta(svg, d, 'olho'); if (olho) olho.classList.add('olho');
    const grupo = svg.querySelector('.pecas'), pegas = svg.querySelector('.pegas');
    this.pecas = {}; this.ativa = null; this.arrastouUma = false;
    this.raioIma = Math.max(150, W * 0.27);
    embaralha(pecas).forEach((nome, i) => {
      const c = caixaPeca(dk, nome), g = criaOsso(dk, nome);
      const sx = bx + lw * (i % colunas), sy = by + lh * Math.floor(i / colunas);
      const s = Math.min((lw - 26) / c[2], (lh - 22) / c[3], 1);
      const centro = { x: c[0] + c[2] / 2, y: c[1] + c[3] / 2 };
      const base = { x: sx + lw / 2 - s * centro.x, y: sy + lh / 2 - s * centro.y, s: s };
      g.classList.add('peca');
      g.style.transform = this.tr(base);
      grupo.appendChild(g);
      const pega = svgEl('rect', { 'class': 'pega', x: sx + 5, y: sy + 5, width: lw - 10, height: lh - 10, rx: 20 });
      pega.dataset.osso = nome;
      pegas.appendChild(pega);
      this.pecas[nome] = { nome: nome, g: g, base: base, centro: centro, vaga: { x: sx + lw / 2, y: sy + lh / 2 }, pega: pega, posta: false };
    });

  sai() { clearTimeout(this.ocioso); },
  tr(b) { return 'translate(' + b.x + 'px,' + b.y + 'px) scale(' + b.s + ')'; },
  daVez() { return pecasDe(this.dino).map(n => this.pecas[n]).find(p => !p.posta); },
  /* instrução da vez: "ARRASTE A CABEÇA"...; a peça e o lugar dela pulsam */
  passo() {

  },
  armaOcioso() {

  },
  /* a mãozinha demonstra o gesto: da peça até o lugar dela */
  mao(p, vezes) {
    const g = this.svg.querySelector('.mao');

    /* o símbolo tem a seta para a direita; espelhado quando o gesto vai para a esquerda (a ponta do dedo fica em 0,0) */
    const t = 120, u = svgEl('use', { href: '#x-mao-arrastar', x: -0.43 * t, y: -0.13 * t, width: t, height: t });
    if (p.centro.x < p.vaga.x) u.setAttribute('transform', 'scale(-1,1)');

  semMao() {

  sugestao() {

      this.mordida({ morde: { mandibula: d.abre || 16 } }, 2, 600);
      await espera(350);
      sam.getAnimations().forEach(x => x.cancel()); sam.classList.add('some');
      Som.nhac(); this.onoma(on, a.c[0], a.c[1] - 90);
    } else if (m.efeito === 'moita') await this.cortaMoita(a, on);
    else {
      this.balancaMoita(a);
      (this.bicho || this.el(a.bicho)).style.display = 'none';
      Som.nhac(); this.onoma(on, a.c[0], a.c[1] - 110);
    }
    await espera(700);
    this.pose(poseZero(g), 500);
    await espera(450);
    Pista.oferece(dk, 3, [r.fala], this.posPista());
    await espera(1600);
  },
  /* pterodáctilo na missão dos outros: voa até lá, pousa (em cima da planta, ou ao lado da carne), olha e levanta voo */
  async pousaEOlha(a, r, aoLado) {
    const dk = this.dino, d = DINOS[dk], svg = this.dsvg, P = d.poses;
    const X = aoLado ? a.c[0] - 262 : a.c[0] - 105, dy = (aoLado ? 620 : a.c[1] - 22) - 143 - d.lugar.y;
    await espera(400);
    Som.flap();
    await this.mexe(X - 24, dy - 50);
    this.paraAsas(); this.pose(P.pousado, 460);
    await this.mexe(X, dy, 460);
    await espera(250);
    if (aoLado) { this.pose({ pescoco: 10, cabeca: 12 }, 450); await espera(650); this.pose({ pescoco: -15, cabeca: -8 }, 600); await espera(800); }   // olha a carne de baixo para cima
    else { this.pose(P.pega, 450); await espera(750); gira(junta(svg, d, 'cabeca'), [P.pega.cabeca, P.pega.cabeca + 5, P.pega.cabeca - 5, P.pega.cabeca + 5, P.pega.cabeca], 800); await espera(850); }
    this.pose({ pescoco: P.pousado.pescoco, cabeca: P.pousado.cabeca }, 350);
    Pista.oferece(dk, 3, [r.fala], this.posPista());
    await espera(1500);
    this.pose(P.voo, 420); Som.flap();
    await this.mexe(X + 30, dy - 100, 500);
    this.bateAsas();
    await espera(900);
  },
  /* animal de OUTRO período: aparece na borda, a camada dele acende num mini-corte do solo */
  visita(dk) {
    const d = DINOS[dk], aqui = DINOS[this.dono].periodo, v = $('#visita');
    v.hidden = true; v.innerHTML = '';
    v.appendChild(criaDino(dk));
    let h = '<div class="miniSolo">';
    ORDEM_SOLO.forEach(p => { h += '<i class="' + (p === d.periodo ? 'acesa' : p === aqui ? 'aqui' : '') + '" style="background:' + PERIODOS[p].cor + '">' + PERIODOS[p].nome + '</i>'; });
    v.insertAdjacentHTML('beforeend', h + '</div>');
    void v.offsetWidth; v.hidden = false;
    alegria(v.firstChild, dk);
    clearTimeout(this.tmVisita);
    this.tmVisita = setTimeout(() => { v.hidden = true; }, 3800);
    dizer(PERIODOS[d.periodo].tempo < PERIODOS[aqui].tempo ? UI.antes : UI.depois);
    const g = geracao;
    setTimeout(() => { if (g === geracao && telaAtual === 'missao' && this.dino !== this.dono) this.chamaCerto(5000); }, 2600);
  },
  onoma(txt, x, y, k) {
    if (!txt) return;
    x = limita(x, 150, 1050); y = Math.max(90, y);
    const t = svgEl('text', { x: x, y: y, 'class': 'onoma' });
    if (k) t.style.fontSize = (84 * k) + 'px';
    t.textContent = txt; t.style.transformOrigin = x + 'px ' + y + 'px';
    this.gEfeitos.appendChild(t);
    const a = anima(t, [{ opacity: 0, transform: 'translateY(20px) scale(.5)' }, { opacity: 1, transform: 'translateY(-10px) scale(1.15)', offset: 0.2 },
      { opacity: 1, transform: 'translateY(-30px) scale(1)', offset: 0.8 }, { opacity: 0, transform: 'translateY(-60px) scale(1)' }], { duration: 1400 });
    if (a) a.onfinish = () => t.remove(); else setTimeout(() => t.remove(), 1400);
  },
  montar() {
    $('#cenaJanela').addEventListener('pointerdown', ev => this.toqueCena(ev));
  },
  redimensiona() { this.ajusta(); }
};

/* G) QUEM SOU EU? — pistas do CONTEUDO.md / CONTEUDO-2.md, uma por vez; ela escolhe entre 2 ou 3 dos animais desbloqueados.
   Com 14 animais, as pistas 1 e 2 de alguns servem a mais de um (CONTEUDO-2, AJUSTES NOS ANTIGOS). Por isso:
   - quando dá, as outras opções não são "parecidas" com o alvo (DINOS[..].parecidos);
   - escolher outro animal ANTES da 3ª pista não fecha nada: "BOA IDEIA! OUÇA MAIS UMA." e vem a pista seguinte;
   - depois da 3ª pista (que resolve), a opção que não é diz a pista dela e sai, como antes. Acertar vale a qualquer momento. */
Telas.quem = {
  fixo: null, alvo: null, n: 0, acabou: false, ultimo: null,
  entra(arg) {
    this.fixo = arg.dino || null;
    voltarPara = () => { if (arg.dino) ir('ficha', { dino: arg.dino }); else ir('album'); };
    if (achados().length < 2) { $('#quemOpcoes').innerHTML = ''; dizer(UI.caveMais); return; }
    this.rodada();
  },
  rodada() {
    geracao++;
    Pista.esconde();
    const livres = achados();
    let alvo = this.fixo;
    if (!alvo) {
      let cand = livres.filter(k => estado.dinos[k].selos[2] === 0);
      if (!cand.length) cand = livres.filter(k => k !== this.ultimo);
      alvo = cand[Math.floor(Math.random() * cand.length)];
    }
    this.alvo = this.ultimo = alvo; this.fixo = null; this.acabou = false;
    const par = (a, b) => (DINOS[a].parecidos || []).indexOf(b) >= 0 || (DINOS[b].parecidos || []).indexOf(a) >= 0;
    const outros = embaralha(livres.filter(k => k !== alvo));
    const opcoes = embaralha([alvo].concat(outros.filter(k => !par(alvo, k)).concat(outros.filter(k => par(alvo, k))).slice(0, 2)));
    const cx = $('#quemOpcoes'); cx.innerHTML = '';
    opcoes.forEach(dk => {
      const b = document.createElement('button');
      b.className = 'opcao'; b.dataset.dino = dk;
      b.appendChild(criaDino(dk));
      b.addEventListener('click', () => this.escolhe(dk, b));
      cx.appendChild(b);
    });
    $('#quemLuzes').innerHTML = DINOS[alvo].quem.map(() => usa('x-lupa-grande')).join('');
    $('#btQuemDeNovo').hidden = true;
    this.pista(0, true);
  },
  pista(i, comTitulo) {
    const d = DINOS[this.alvo];
    this.n = i;
    $$('#quemLuzes svg').forEach((s, k) => s.classList.toggle('acesa', k <= i));
    Som.toque();
    dizer(comTitulo ? [UI.quem, d.quem[i]] : d.quem[i], { fim: () => depois(3600, () => { if (!this.acabou && this.n === i && i < d.quem.length - 1) this.pista(i + 1); }) });
  },
  escolhe(dk, b) {
    if (this.acabou || b.classList.contains('saiu')) return;
    const d = DINOS[dk];
    if (dk !== this.alvo && this.n < DINOS[this.alvo].quem.length - 1) {   // ainda falta pista: boa ideia, ouça mais uma
      geracao++;
      Som.toque();
      alegria(b.firstChild, dk);
      const i = this.n + 1;
      dizer(UI.boaIdeia, { fim: () => depois(350, () => { if (!this.acabou) this.pista(i); }) });
      return;
    }
    if (dk !== this.alvo) {                             // já ouviu as três: aquele animal diz algo dele e sai; sobra menos opção
      geracao++;
      Som.toque();
      alegria(b.firstChild, dk);
      const i = this.n;
      dizer(d.quem[d.quem.length - 1], { fim: () => { b.classList.add('saiu'); depois(900, () => { if (!this.acabou) this.pista(i); }); } });
      return;
    }
    geracao++;
    this.acabou = true;
    festa(60);
    b.classList.add('certa'); alegria(b.firstChild, dk);
    $$('.opcao').forEach(o => { if (o !== b) o.classList.add('saiu'); });
    $$('#quemLuzes svg').forEach(s => s.classList.add('acesa'));
    const r = caixaPalco($('#quemCarta')), pos = { x: r.cx, y: r.cy };
    if (!Pista.oferece(dk, 2, [UI.acertou, d.nome], pos)) depois(2600, () => { $('#btQuemDeNovo').hidden = false; });
  },
  montar() {
    $('#quemCarta').addEventListener('click', () => {
      if (this.acabou || !this.alvo || achados().length < 2) return;
      geracao++;
      this.pista((this.n + 1) % DINOS[this.alvo].quem.length);
    });
    $('#btQuemDeNovo').addEventListener('click', () => { Som.toque(); this.rodada(); });
  }
};

/* I) ÁLBUM (botão MEUS BICHOS): os 14, uma página por período (abas grandes à esquerda) */
Telas.album = {

      if (por >= 0) bs.classList.add('novo');

        else if (i < 0) ir('ficha', { dino: dk });        // nenhum selo ainda: a ficha mostra como ganhar cada um

/* J) HISTÓRIA: a historinha de um selo, ou a explicação de um período / da Era Mesozoica, contada frase a frase
   (voz + texto grande). Avança sozinha ao fim de cada fala e também por toque (na figura ou no texto); tem botão de
   ouvir de novo; o botão de voltar da barra fecha. As frases compridas ficam em MAIÚSCULAS, como todo o resto do jogo
   (é a letra que ela lê); o catálogo guarda o texto como está no CONTEUDO-2.
   arg: { tipo: 'selo', dino, selo, carimbar (acabou de ganhar: ao fechar, a ficha carimba o selo), volta: 'album' }
        { tipo: 'periodo', p }     { tipo: 'era' }                                                                    */
function poeCena(caixa, p) {             // a cena do período como imagem (sem os objetos das missões)
  caixa.insertAdjacentHTML('afterbegin', cenaCompleta(p));
  const svg = caixa.querySelector('svg');
  svg.setAttribute('preserveAspectRatio', 'xMidYMax slice');
  (PERIODOS[p].objetos || []).forEach(id => { const e = svg.querySelector('#' + id); if (e) e.style.display = 'none'; });
  const po = svg.querySelector('#ctx-poeira'); if (po) po.style.display = 'none';
}
Telas.historia = {
  arg: null, frases: [], i: -1, acabou: false, tok: 0, tmFim: 0,
  entra(arg) {
    this.arg = arg;
    if (arg.tipo === 'selo' && arg.carimbar) arg.ganhou = arg.selo;
    voltarPara = () => this.fecha();
    $('#t-historia').dataset.tipo = arg.tipo;
    this.monta();
    this.comeca();
  },
  sai() {
    this.tok++; clearTimeout(this.tmFim); Voz.calar();
    $('#btVoltar').classList.remove('sugere');
    $('#histFig').innerHTML = ''; $('#histSelos').innerHTML = '';
  },
  monta() {
    const a = this.arg, fig = $('#histFig');
    if (a.tipo === 'selo') {
      const d = DINOS[a.dino], s = d.selos[a.selo];
      this.frases = s.historia;
      fig.innerHTML = '<span class="histTitulo" style="color:' + d.cor + '">' + s.fala + '</span>' + ilus(s.ilustra, 'grande');
    } else if (a.tipo === 'periodo') {
      const per = PERIODOS[a.p];
      this.frases = EXPLICA[a.p];
      fig.innerHTML = '<span class="histCena" style="background:' + per.ceu + '"><b class="placaNome">' + per.nome + '</b></span><span class="histBichos" style="background:' + per.cor + '"></span>';
      poeCena(fig.querySelector('.histCena'), a.p);
      const cx = fig.querySelector('.histBichos');
      dinosDe(a.p).forEach(dk => {                    // os animais do período (em sombra os que ela ainda não achou); pulam quando a frase fala deles
        const s = criaDino(dk, { estatico: true, sombra: !estado.dinos[dk].achado });
        s.setAttribute('preserveAspectRatio', 'xMidYMax meet');
        cx.appendChild(s);
      });
    } else {
      this.frases = EXPLICA.era;                     // as três partes, uma em cima da outra, como no corte do solo
      fig.innerHTML = ORDEM_SOLO.map(p => '<span class="histCena faixa" data-p="' + p + '" style="background:' + PERIODOS[p].ceu + '"><b class="placaNome">' + PERIODOS[p].nome + '</b></span>').join('');
      $$('.faixa', fig).forEach(c => poeCena(c, c.dataset.p));
    }
    this.miniaturas();
  },
  /* coluna dos 4 selos do animal (como na ficha): troca de história; o que ainda não foi ganho mostra como ganhar */
  miniaturas() {
    const a = this.arg, col = $('#histSelos');
    col.innerHTML = '';
    if (a.tipo !== 'selo') return;
    const dk = a.dino, d = DINOS[dk], e = estado.dinos[dk], viz = amigoDe(dk);
    const comoGanhar = [d.missao.icone, 'x-estrela', 'ic-interrog', null];
    const dicas = [UI.dicaSelo[0], UI.dicaSelo[1], UI.dicaSelo[2], UI.sugere.amigo];
    d.selos.forEach((s, i) => {
      const b = document.createElement('button'), aqui = i === a.selo, st = aqui ? 2 : e.selos[i];
      b.className = 'selo' + (st === 2 ? ' tem' + (aqui ? ' atual' : e.ouvidas[i] ? '' : ' novo') : st === 1 ? ' pista' : '');
      if (st === 2) b.innerHTML = ilus(s.ilustra);
      else if (st === 1) b.innerHTML = '<svg viewBox="0 0 100 100"><use href="#x-pista"/></svg>';
      else if (comoGanhar[i]) b.innerHTML = usa(comoGanhar[i]);
      else b.appendChild(criaDino(viz, { estatico: true, sombra: !estado.dinos[viz].achado }));
      b.addEventListener('click', () => {
        if (st === 1) { this.tok++; clearTimeout(this.tmFim); Pista.mergulha(dk, i, b); return; }
        Som.toque();
        if (aqui) return this.comeca();
        if (st === 2) { a.selo = i; this.monta(); return this.comeca(); }
        sacode(b); this.dica(dicas[i]);
      });
      col.appendChild(b);
    });
  },
  comeca() {
    this.i = -1; this.acabou = false;
    $('#btVoltar').classList.remove('sugere');
    this.proxima();
  },
  proxima() {
    const tok = ++this.tok;
    clearTimeout(this.tmFim);
    if (this.acabou) return;
    if (++this.i >= this.frases.length) return this.termina();
    const f = this.frases[this.i];
    this.texto(f); this.pontos(); this.destaque(f);
    Voz.falar(idFrase(f), {}, () => { if (tok === this.tok) this.tmFim = setTimeout(() => { if (tok === this.tok) this.proxima(); }, 700); });
  },
  /* chegou ao fim: a história conta como ouvida (o brilho do selo e a sugestão da ficha param); quem acabou de ganhar o selo segue sozinha para o carimbo */
  termina() {
    const a = this.arg, tok = this.tok;
    this.acabou = true; this.i = this.frases.length - 1;
    Voz.calar();
    if (a.tipo === 'selo') {
      const e = estado.dinos[a.dino];
      if (e.selos[a.selo] === 2 && !e.ouvidas[a.selo]) { e.ouvidas[a.selo] = 1; salvar(); }
    } else {
      const k = a.tipo === 'era' ? 'era' : a.p;
      if (!estado.vistos[k]) { estado.vistos[k] = true; salvar(); }
    }
    this.pontos();
    $('#btVoltar').classList.add('sugere');
    if (a.carimbar) this.tmFim = setTimeout(() => { if (tok === this.tok && telaAtual === 'historia') this.fecha(); }, 2600);
  },
  fecha() {
    const a = this.arg;
    if (a.tipo !== 'selo') return ir('solo');
    if (a.carimbar) return ir('ficha', { dino: a.dino, carimbar: a.ganhou });
    if (a.volta === 'album') return ir('album');
    ir('ficha', { dino: a.dino });
  },
  /* toque na figura ou no texto: próxima frase (depois da última, fecha) */
  toque() { Som.toque(); if (this.acabou) this.fecha(); else this.proxima(); },
  /* dica de um selo ainda não ganho: fala a dica e retoma a frase em que a história estava */
  dica(t) {
    const tok = ++this.tok;
    clearTimeout(this.tmFim);
    this.texto(t);
    Voz.falar(idFrase(t), {}, () => {
      if (tok === this.tok) this.tmFim = setTimeout(() => {
        if (tok !== this.tok) return;
        if (this.acabou) this.texto(this.frases[this.i]); else { this.i--; this.proxima(); }
      }, 500);
    });
  },
  texto(t) {
    const el = $('#histTxt'), caixa = $('#histTxtBt'), u = Tela.u;
    el.textContent = t;
    let f = 30 * u;
    el.style.fontSize = f + 'px';
    while (f > 12 * u && (el.offsetHeight > caixa.clientHeight - 14 * u || el.scrollWidth > el.clientWidth + 1)) { f -= u; el.style.fontSize = f + 'px'; }
    anima(el, [{ opacity: 0, transform: 'translateY(8%)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 260, easing: 'ease-out' });
  },
  pontos() {
    $('#histPontos').innerHTML = this.frases.map((_, k) => '<i class="' + (this.acabou || k < this.i ? 'feito' : k === this.i ? 'atual' : '') + '"></i>').join('');
  },
  /* a frase fala de um animal (ele pula) ou de um período (a faixa dele acende) */
  destaque(f) {
    const t = f.toLowerCase(), fig = $('#histFig');
    $$('.histBichos svg', fig).forEach(s => { if (t.indexOf(DINOS[s.dataset.dino].nome.toLowerCase()) >= 0) pula(s, [0, 16, 0, 9, 0], 900); });
    const faixas = $$('.faixa', fig), ditas = faixas.filter(c => t.indexOf(PERIODOS[c.dataset.p].nome.toLowerCase()) >= 0);
    faixas.forEach(c => { c.classList.toggle('luz', ditas.indexOf(c) >= 0); c.classList.toggle('apagada', ditas.length > 0 && ditas.indexOf(c) < 0); });
  },
  redimensiona() { const t = $('#histTxt').textContent; if (t) this.texto(t); },
  montar() {
    $('#histFig').addEventListener('click', () => this.toque());
    $('#histTxtBt').addEventListener('click', () => this.toque());
    $('#btHistDeNovo').addEventListener('click', () => { Som.toque(); this.comeca(); });
  }
};

    $('#btApagarNao').addEventListener('click', () => { $('#confirma').hidden = true; });
    $('#btApagarSim').addEventListener('click', () => {
      estado = estadoNovo();
      try { localStorage.removeItem(CHAVE_SALVAR); } catch (_) {}
      this.fecha();
      if (telaAtual !== 'inicio') ir('inicio');
    });
  }
};

/* ---------- 11. PARTIDA ---------- */
function partida() {
  try { document.documentElement.lang = 'pt-BR'; } catch (_) {}
  mede();
  Voz.iniciar();
  for (const n in Telas) if (Telas[n].montar) Telas[n].montar();
  Adulto.montar();
  $('#btVoltar').addEventListener('click', () => { Som.toque(); if (typeof voltarPara === 'function') voltarPara(); else if (voltarPara) ir(voltarPara); });
  $('#fala').addEventListener('click', () => { if (ultimaFala.length) dizer(ultimaFala); });
  $('#pista').addEventListener('click', () => Pista.toca());
  /* som só depois de um toque */
  document.addEventListener('pointerdown', () => { Som.iniciar(); if (!Voz.ligada) { Voz.ligada = true; Voz.carregarVozes(); } }, true);
  /* nada de menu de contexto, seleção, arrastar imagem ou zoom acidental (a área de adultos pode rolar) */
  const adulto = ev => ev.target && ev.target.closest && ev.target.closest('.adulto');
  ['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'dblclick'].forEach(e => document.addEventListener(e, ev => { if (!adulto(ev)) ev.preventDefault(); }));
  document.addEventListener('touchmove', ev => { if (!adulto(ev)) ev.preventDefault(); }, { passive: false });
  let tm = 0;
  const redimensiona = () => {
    mede();
    const t = $('#falaTxt').textContent; if (t) mostraFala(t);
    clearTimeout(tm);
    tm = setTimeout(() => { mede(); const T = Telas[telaAtual]; if (T && T.redimensiona) T.redimensiona(); Pista.reposiciona(); }, 200);
  };
  window.addEventListener('resize', redimensiona);
  window.addEventListener('orientationchange', redimensiona);
  if (typeof ResizeObserver !== 'undefined') { try { new ResizeObserver(redimensiona).observe(document.body); } catch (_) {} }
  window.addEventListener('pagehide', () => Voz.calar());
  Estudio.detecta();
  /* atalho de depuração (só com #debug no endereço; não aparece para a criança): window.CAVA */
  if (DEPURA) window.CAVA = {
    get estado() { return estado; }, set estado(e) { estado = e; },
    DINOS, FRASES, BLOCOS, EXPLICA, UI, Telas, Tela, Palco, mede, Voz, Som, Pista, Estudio, ir, salvar, dizer, estadoNovo, reacao, pontoNaPose, camadaAberta, tudoFeito, desfile, frasesDoBloco, frasesEmUso,
    /* CAVA.historia('estego', 0) abre a história de um selo (mesmo sem tê-lo); CAVA.periodo('jurassico' | 'cretaceo' | 'triassico' | 'era') abre a explicação;
       CAVA.pista('estego', 2) deixa a pista do selo pendente e abre a escavação dela (para ganhar o selo de verdade);
       CAVA.rapido(true) faz as falas sem gravação durarem pouco (as telas de história avançam depressa nos testes) */
    historia(dk, i, mais) { ir('historia', Object.assign({ tipo: 'selo', dino: dk, selo: i || 0 }, mais)); },
    periodo(p) { ir('historia', p === 'era' ? { tipo: 'era' } : { tipo: 'periodo', p: p }); },
    pista(dk, i) { const e = estado.dinos[dk]; e.achado = true; e.selos[i] = 1; e.ouvidas[i] = 0; salvar(); ir('cavar', { tipo: 'extra', dino: dk, selo: i }); },
    rapido(sim) { Voz.rapido = !!sim; },
    get tela() { return telaAtual; }, get fala() { return ultimaFala.slice(); },
    /* CAVA.libera('dinos') acha os 14 e conclui as 14 missões (abre as 3 camadas); CAVA.libera('tudo') também conclui fichas e selos;
       CAVA.libera('antigos') deixa só os 6 primeiros completos (como o progresso de quem jogava antes da ampliação);
       um segundo argumento escolhe os animais: CAVA.libera('tudo', ['estego', 'apato']) */
    libera(quanto, quais) {
      const antigos = ['estego', 'braquio', 'trex', 'trike', 'estauri', 'plateo'];
      if (quanto === 'antigos') { estado = estadoNovo(); estado.abertas = { cretaceo: true, triassico: true }; estado.fim = true; quais = antigos; quanto = 'tudo'; }
      for (const k of quais || Object.keys(DINOS)) {
        const e = estado.dinos[k]; e.achado = true; e.missao = true;
        if (quanto === 'tudo') { DINOS[k].toques.forEach(t => { e.toques[t.chave] = 1; }); CAMPOS_FICHA.forEach(c => { e[c] = true; }); e.selos = [2, 2, 2, 2]; }
      }
      salvar(); ir('solo');
    }
  };
}

/* ===== estudio.js ===== */
'use strict';
/* =====================================================================
   CAVA OSSO — ESTÚDIO DE VOZ (área de adultos)
   Só existe quando o jogo roda pelo servidor local (GET /api/vozes responde).
   Grava cada frase do catálogo FRASES com o microfone e envia para o servidor,
   que salva em vozes/<id>.<ext>. O `node build.js` embute as gravações nos HTMLs.
   As frases vêm em BLOCOS (dados.js), na ordem em que a criança encontra o conteúdo; cada bloco tem contador,
   estimativa do que falta e o seu "gravar em sequência". O bloco "Sem uso" não entra em nenhum contador.
   ===================================================================== */
const Estudio = {
  disponivel: false, lista: {}, soFaltam: false, erro: '', formato: null, abertos: {}, SEG: 15,   // SEG: segundos por frase na estimativa
  stream: null, gravador: null, gravando: null, pedacos: [], seq: null, tocando: null,

  /* só tenta em localhost: a versão publicada não faz pedido de rede nenhum */
  async detecta() {
    if (!/^https?:$/.test(location.protocol) || !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
    try {
      const r = await fetch('/api/vozes', { cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();
      if (!j || !Array.isArray(j.vozes)) return;
      this.disponivel = true;
      this.aplica(j.vozes);
    } catch (_) {}
  },
  aplica(vozes) {
    this.lista = {};
    const urls = {};
    vozes.forEach(v => { this.lista[v.id] = v; urls[v.id] = '/vozes/' + v.id + '.' + v.ext + '?v=' + v.mod; });
    Voz.servidor = urls;               // no servidor local o jogo toca direto da pasta vozes/ (sem rebuild)
  },
  async atualiza() {
    try { const j = await (await fetch('/api/vozes', { cache: 'no-store' })).json(); this.aplica(j.vozes || []); } catch (_) {}
  },

  /* formato de gravação: AAC em MP4 quando der (toca em Android e iPhone); senão Opus em WebM */
  escolheFormato() {
    if (typeof MediaRecorder === 'undefined') return null;
    const pode = t => { try { return MediaRecorder.isTypeSupported(t); } catch (_) { return false; } };
    if (pode('audio/mp4;codecs=mp4a.40.2')) return { mime: 'audio/mp4;codecs=mp4a.40.2', tipo: 'audio/mp4', nome: 'MP4 (AAC)', ok: true };
    if (pode('audio/mp4') && !pode('audio/webm')) return { mime: 'audio/mp4', tipo: 'audio/mp4', nome: 'MP4 (AAC)', ok: true };
    if (pode('audio/webm;codecs=opus')) return { mime: 'audio/webm;codecs=opus', tipo: 'audio/webm', nome: 'WebM (Opus)', ok: false };
    if (pode('audio/webm')) return { mime: 'audio/webm', tipo: 'audio/webm', nome: 'WebM', ok: false };
    if (pode('audio/mp4')) return { mime: 'audio/mp4', tipo: 'audio/mp4', nome: 'MP4', ok: true };
    return { mime: '', tipo: '', nome: 'padrão do navegador', ok: false };
  },

  abre() {
    this.formato = this.escolheFormato();
    this.erro = ''; this.seq = null;
    $('#estudio').hidden = false;
    Voz.calar();
    this.atualiza().then(() => this.desenha());
    this.desenha();
  },
  fecha() {
    this.paraTudo();
    if (this.stream) { try { this.stream.getTracks().forEach(t => t.stop()); } catch (_) {} this.stream = null; }
    $('#estudio').hidden = true; $('#estudio').innerHTML = '';
  },
  paraTudo() {
    if (this.gravador && this.gravador.state !== 'inactive') { try { this.gravador.onstop = null; this.gravador.stop(); } catch (_) {} }
    this.gravador = null; this.gravando = null;
    Voz.calar();
  },
  /* frases que contam (todos os blocos menos "Sem uso"), na ordem dos blocos */
  ids() { return [].concat.apply([], BLOCOS.filter(b => b !== BLOCO_SEM_USO).map(frasesDoBloco)); },
  faltam(lista) { return (lista || this.ids()).filter(id => !this.lista[id]); },
  esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); },
  /* estimativa simples: SEG segundos por frase (gravar, ouvir, confirmar) */
  tempo(n) { return n ? '~' + Math.max(1, Math.round(n * this.SEG / 60)) + ' min' : ''; },
  indice(b) { return BLOCOS.indexOf(b); },

  linhaFrase(id) {
    const f = this.formato, fr = FRASES[id], tem = !!this.lista[id], grav = this.gravando === id, longa = fr.t !== fr.t.toUpperCase();
    return '<div class="frase' + (tem ? ' tem' : '') + (longa ? ' longa' : '') + '" data-id="' + id + '"><span class="bola" title="' + (tem ? 'gravada' : 'falta') + '"></span>' +
      '<span class="txt">' + this.esc(fr.t) + (fr.devagar ? '<em>falar bem devagar' + (fr.dica ? ': ' + this.esc(fr.dica) : '') + '</em>' : '') + '<small>' + id + ' · ' + this.esc(fr.onde.join('; ')) + (tem ? ' · ' + this.lista[id].ext + ', ' + Math.round(this.lista[id].tam / 1024) + ' KB' : '') + '</small></span>' +
      '<button data-a="gravar" class="' + (grav ? 'gravando' : '') + '"' + (!f || (this.gravando && !grav) ? ' disabled' : '') + '>' + (grav ? 'Parar' : tem ? 'Regravar' : 'Gravar') + '</button>' +
      '<button data-a="ouvir"' + (tem ? '' : ' disabled') + '>Ouvir</button>' +
      (this.apagando === id ? '<button data-a="apagarSim" class="perigo">Apagar mesmo</button><button data-a="apagarNao">Não</button>'
        : '<button data-a="apagar" class="perigo"' + (tem ? '' : ' disabled') + '>Apagar</button>') + '</div>';
  },
  desenha() {
    const cx = $('#estudio');
    if (cx.hidden) return;
    if (this.seq) return this.desenhaSeq();
    const ids = this.ids(), falta = this.faltam(ids).length, feitas = ids.length - falta, f = this.formato;
    const rolagem = cx.querySelector('.painel') ? cx.querySelector('.painel').scrollTop : 0;
    let h = '<div class="painel"><div class="topo"><h2>Estúdio de voz</h2><span class="conta">' + feitas + ' de ' + ids.length + ' gravadas' + (falta ? ' · faltam ' + falta + ' (' + this.tempo(falta) + ')' : '') + '</span>' +
      '<button data-a="filtro">' + (this.soFaltam ? 'Mostrar todas' : 'Só as que faltam') + '</button>' +
      '<button data-a="seq" class="forte"' + (falta ? '' : ' disabled') + '>Gravar tudo em sequência</button>' +
      '<button data-a="fechar">Fechar</button></div>';
    h += '<p>As frases estão em <b>blocos</b>, na ordem em que a criança encontra o conteúdo. Abra um bloco para ver as frases ou use <b>Gravar em sequência</b> do bloco: a frase aparece grande, você grava, ouve e confirma. ' +
      'Cada frase curta tem de 1 a 3 segundos; as das histórias e dos períodos são mais compridas (leia com calma, uma de cada vez). O silêncio do começo e do fim é cortado sozinho na hora de tocar. ' +
      'O jogo aberto por este servidor já usa as gravações. Para levá-las para o <code>index.html</code> e o <code>artefato.html</code>, rode <code>node build.js</code>.</p>';
    if (!f) h += '<p class="erro">Este navegador não grava áudio (sem MediaRecorder). Dá para ouvir e apagar, mas não gravar.</p>';
    else if (!f.ok) h += '<p class="aviso">Formato de gravação deste navegador: ' + f.nome + '. iPhones e iPads antigos podem não tocar esse formato; se puder, grave por um navegador que ofereça MP4 (AAC), como o Safari ou o Chrome recente.</p>';
    else h += '<p class="aviso" style="background:#e3f5ea;color:#1c6b3e">Formato de gravação: ' + f.nome + ' (toca em Android e iPhone).</p>';
    if (this.erro) h += '<p class="erro">' + this.esc(this.erro) + '</p>';
    for (const b of BLOCOS) {
      const doBloco = frasesDoBloco(b), n = doBloco.length, sem = b === BLOCO_SEM_USO, fb = this.faltam(doBloco).length, aberto = !!this.abertos[b];
      if (!n) continue;
      const pct = Math.round(100 * (n - fb) / n);
      h += '<div class="bloco' + (sem ? ' semUso' : fb ? '' : ' pronto') + (aberto ? ' aberto' : '') + '" data-bloco="' + this.indice(b) + '">' +
        '<div class="blocoTit"><b>' + this.esc(b) + '</b>' +
        (sem ? '<span class="blocoConta">' + n + ' frases que o jogo não usa mais (gravações guardadas). Não entram nos contadores.</span>'
          : '<span class="blocoConta">' + (n - fb) + ' de ' + n + ' gravadas · ' + (fb ? '<b>faltam ' + fb + '</b> (' + this.tempo(fb) + ')' : 'completo') + '</span>' +
            '<span class="barraProg"><i style="width:' + pct + '%"></i></span>') + '</div>' +
        (sem ? '' : '<button data-a="seqBloco" class="forte"' + (fb && f ? '' : ' disabled') + '>Gravar em sequência' + (fb ? ' (' + fb + ')' : '') + '</button>') +
        '<button data-a="abreBloco">' + (aberto ? 'Esconder frases' : 'Ver frases') + '</button></div>';
      if (!aberto) continue;
      let algum = false;
      for (const g of GRUPOS) {
        const doGrupo = doBloco.filter(id => FRASES[id].grupo === g), mostra = doGrupo.filter(id => !(this.soFaltam && this.lista[id]));
        if (!mostra.length) continue;
        algum = true;
        if (!sem) h += '<h3>' + this.esc(g) + ' <small>(faltam ' + this.faltam(doGrupo).length + ' de ' + doGrupo.length + ')</small></h3>';
        for (const id of mostra) h += this.linhaFrase(id);
      }
      if (!algum) h += '<p class="vazio">Nenhuma frase faltando neste bloco.</p>';
    }
    cx.innerHTML = h + '</div>';
    cx.querySelector('.painel').scrollTop = rolagem;
  },

  /* modo "gravar em sequência" (de um bloco ou de tudo): frase na tela -> gravar -> ouvir -> confirmar -> próxima que falta */
  seqLista() { return this.seq && this.seq.bloco ? frasesDoBloco(this.seq.bloco) : this.ids(); },
  desenhaSeq() {
    const s = this.seq, cx = $('#estudio'), fr = FRASES[s.id], f = this.formato, lista = this.seqLista();
    const faltam = this.faltam(lista).length, longa = fr.t !== fr.t.toUpperCase();
    let h = '<div class="seq"><div class="onde"><b>' + this.esc(s.bloco || 'Todos os blocos') + '</b> · faltam ' + faltam + ' de ' + lista.length + (faltam ? ' (' + this.tempo(faltam) + ')' : '') + '</div>' +
      '<div class="onde">' + this.esc(fr.grupo) + ' · ' + this.esc(fr.onde.join('; ')) + '</div>' +
      '<div class="grande' + (longa ? ' longa' : '') + '">' + this.esc(fr.t) + '</div>' + (fr.devagar ? '<div class="aviso">Nome: fale bem devagar, separando as sílabas' + (fr.dica ? ' (' + this.esc(fr.dica) + ')' : '') + '.</div>' : '');
    if (this.erro) h += '<p class="erro">' + this.esc(this.erro) + '</p>';
    h += '<div class="linha">';
    if (s.fase === 'pronto') h += '<button data-a="seqGravar" class="forte"' + (f ? '' : ' disabled') + '>Gravar</button><button data-a="seqPular">Pular</button>';
    else if (s.fase === 'gravando') h += '<button data-a="seqParar" class="gravando">Parar</button>';
    else if (s.fase === 'revisao') h += '<button data-a="seqOk" class="forte">Ficou boa: próxima</button><button data-a="seqOuvir">Ouvir de novo</button><button data-a="seqGravar">Regravar</button>';
    else h += '<button disabled>Salvando…</button>';
    h += '</div><div class="linha"><button data-a="seqSair">Voltar para a lista</button></div></div>';
    cx.innerHTML = h;
  },
  seqProxima(depoisDe) {
    const lista = this.seqLista(), f = this.faltam(lista);
    if (!f.length) { this.seq = null; return this.desenha(); }
    const i = depoisDe ? lista.indexOf(depoisDe) : -1;
    const prox = lista.slice(i + 1).find(id => !this.lista[id]) || f[0];
    this.seq = { bloco: this.seq ? this.seq.bloco : null, id: prox, fase: 'pronto', blob: null };
    this.desenha();
  },

  async microfone() {
    if (this.stream && this.stream.active) return this.stream;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Este navegador não dá acesso ao microfone nesta página.');
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    return this.stream;
  },
  /* um toque começa a gravar */
  async grava(id) {
    this.erro = '';
    Som.iniciar();
    try {
      const stream = await this.microfone(), f = this.formato;
      const opc = { audioBitsPerSecond: 40000 };
      if (f.mime) opc.mimeType = f.mime;
      const g = this.gravador = new MediaRecorder(stream, opc);
      this.pedacos = [];
      g.ondataavailable = ev => { if (ev.data && ev.data.size) this.pedacos.push(ev.data); };
      g.start();
      this.gravando = id;
      this.limite = setTimeout(() => { if (this.gravando === id) this.para(); }, 15000);     // ninguém fala 15 s numa frase
      return true;
    } catch (e) {
      this.gravando = null;
      this.erro = 'Não consegui usar o microfone: ' + (e && e.message ? e.message : e) + '. Confira a permissão do navegador.';
      return false;
    }
  },
  /* outro toque termina; devolve o Blob gravado */
  para() {
    clearTimeout(this.limite);
    return new Promise(ok => {
      const g = this.gravador;
      if (!g || g.state === 'inactive') { this.gravando = null; return ok(null); }
      g.onstop = () => {
        const tipo = (this.formato && this.formato.tipo) || (g.mimeType || '').split(';')[0] || 'audio/webm';
        const blob = new Blob(this.pedacos, { type: tipo });
        this.gravador = null; this.gravando = null;
        ok(blob.size ? blob : null);
      };
      // segura mais um instante depois do toque em parar, para não perder o fim da última sílaba
      setTimeout(() => { try { g.stop(); } catch (_) { this.gravando = null; ok(null); } }, 350);
    });
  },
  async salva(id, blob) {
    if (blob.size > 1024 * 1024) { this.erro = 'A gravação ficou maior que 1 MB; grave de novo, mais curta.'; return false; }
    try {
      const r = await fetch('/api/vozes/' + id, { method: 'POST', headers: { 'Content-Type': blob.type.split(';')[0] }, body: blob });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || ('erro ' + r.status));
      Voz.esquece(id);
      await this.atualiza();
      return true;
    } catch (e) { this.erro = 'Não consegui salvar: ' + (e && e.message ? e.message : e); return false; }
  },
  async apaga(id) {
    try { await fetch('/api/vozes/' + id, { method: 'DELETE' }); } catch (_) {}
    Voz.esquece(id);
    await this.atualiza();
  },
  ouve(id) { Som.iniciar(); Voz.ligada = true; Voz.falar(id, { semTts: true }); },
  /* toca um Blob ainda não salvo (revisão do modo em sequência), já com o corte de silêncio */
  async ouveBlob(blob) {
    try {
      Som.iniciar(); Voz.calar();
      const g = Voz.analisa(await Voz.decodifica(await blob.arrayBuffer()));
      Voz.toca(g, null);
    } catch (e) { this.erro = 'Este navegador não conseguiu tocar a gravação (' + (e && e.message ? e.message : 'formato') + ').'; this.desenha(); }
  },

  async clique(ev) {
    const bt = ev.target.closest('button[data-a]');
    if (!bt) return;
    const a = bt.dataset.a, linha = bt.closest('.frase'), id = linha && linha.dataset.id, s = this.seq;
    if (a === 'fechar') return this.fecha();
    if (a === 'filtro') { this.soFaltam = !this.soFaltam; return this.desenha(); }
    if (a === 'seq') { this.paraTudo(); this.seq = { bloco: null }; return this.seqProxima(null); }
    const cab = bt.closest('.bloco'), bloco = cab ? BLOCOS[+cab.dataset.bloco] : null;
    if (a === 'abreBloco') { this.abertos[bloco] = !this.abertos[bloco]; return this.desenha(); }
    if (a === 'seqBloco') { this.paraTudo(); this.seq = { bloco: bloco }; return this.seqProxima(null); }
    if (a === 'gravar') {
      if (this.gravando === id) { const blob = await this.para(); if (blob) await this.salva(id, blob); else this.erro = 'A gravação ficou vazia.'; }
      else if (!this.gravando) await this.grava(id);
      return this.desenha();
    }
    if (a === 'ouvir') return this.ouve(id);
    if (a === 'apagar') { this.apagando = id; return this.desenha(); }
    if (a === 'apagarNao') { this.apagando = null; return this.desenha(); }
    if (a === 'apagarSim') { this.apagando = null; await this.apaga(id); return this.desenha(); }
    if (!s) return;
    if (a === 'seqSair') { this.paraTudo(); this.seq = null; return this.desenha(); }
    if (a === 'seqPular') return this.seqProxima(s.id);
    if (a === 'seqGravar') { Voz.calar(); s.blob = null; s.fase = (await this.grava(s.id)) ? 'gravando' : 'pronto'; return this.desenha(); }
    if (a === 'seqParar') {
      s.blob = await this.para();
      if (!s.blob) { this.erro = 'A gravação ficou vazia.'; s.fase = 'pronto'; } else { s.fase = 'revisao'; this.ouveBlob(s.blob); }
      return this.desenha();
    }
    if (a === 'seqOuvir') return this.ouveBlob(s.blob);
    if (a === 'seqOk') {
      s.fase = 'salvando'; this.desenha();
      if (await this.salva(s.id, s.blob)) return this.seqProxima(s.id);
      s.fase = 'revisao'; return this.desenha();
    }
  },
  montar() { $('#estudio').addEventListener('click', ev => this.clique(ev)); }
};
